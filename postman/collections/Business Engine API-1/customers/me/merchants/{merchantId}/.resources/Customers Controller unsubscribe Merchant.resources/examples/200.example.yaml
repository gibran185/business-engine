$kind: http-example
request:
  url: "{{baseUrl}}/customers/me/merchants/:merchantId"
  method: PATCH
  pathVariables:
    merchantId: 11111111-1111-4111-8111-111111111111
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    content: |-
      {
        "status": "unsubscribed"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: json
    content: |-
      {
        "id": "bbbbbbbb-bbbb-4ccc-8ddd-eeeeeeeeeeee",
        "merchant_id": "11111111-1111-4111-8111-111111111111",
        "customer_id": "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee",
        "status": "unsubscribed",
        "first_seen_at": "2026-05-01T10:00:00.000Z",
        "last_seen_at": "2026-05-02T15:30:00.000Z"
      }
order: 1000
