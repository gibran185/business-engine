$kind: http-example
request:
  url: "{{baseUrl}}/customers/me/merchants"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    content: |-
      {
        "merchantId": "11111111-1111-4111-8111-111111111111"
      }
response:
  statusCode: 201
  statusText: Created
  body:
    type: json
    content: |-
      {
        "id": "bbbbbbbb-bbbb-4ccc-8ddd-eeeeeeeeeeee",
        "merchant_id": "11111111-1111-4111-8111-111111111111",
        "customer_id": "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee",
        "first_seen_at": "2026-05-01T12:00:00.000Z",
        "last_seen_at": "2026-05-01T12:00:00.000Z",
        "status": "active"
      }
order: 1000
