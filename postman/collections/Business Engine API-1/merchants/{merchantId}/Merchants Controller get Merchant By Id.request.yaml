$kind: http-request
url: "{{baseUrl}}/merchants/:merchantId"
method: GET
headers:
  Content-Type: application/json
pathVariables:
  - key: merchantId
    value: "{{merchantId}}"
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
order: 500
