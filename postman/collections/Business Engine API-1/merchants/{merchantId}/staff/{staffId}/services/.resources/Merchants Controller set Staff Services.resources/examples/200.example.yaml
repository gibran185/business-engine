$kind: http-example
request:
  url: "{{baseUrl}}/merchants/:merchantId/staff/:staffId/services"
  method: PUT
  pathVariables:
    merchantId: 11111111-1111-4111-8111-111111111111
    staffId: 33333333-3333-4333-8333-333333333333
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    content: |-
      {
        "serviceIds": [
          "22222222-2222-4222-8222-222222222222",
          "88888888-8888-4888-8888-888888888888"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: json
    content: |-
      {
        "staffId": "33333333-3333-4333-8333-333333333333",
        "serviceIds": [
          "22222222-2222-4222-8222-222222222222",
          "88888888-8888-4888-8888-888888888888"
        ]
      }
order: 1000
