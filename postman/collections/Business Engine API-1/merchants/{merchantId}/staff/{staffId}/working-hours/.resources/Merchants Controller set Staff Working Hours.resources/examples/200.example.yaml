$kind: http-example
request:
  url: "{{baseUrl}}/merchants/:merchantId/staff/:staffId/working-hours"
  method: PUT
  pathVariables:
    merchantId: 11111111-1111-4111-8111-111111111111
    staffId: 33333333-3333-4333-8333-333333333333
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    content: |-
      {
        "rows": [
          {
            "dayOfWeek": 1,
            "startMinute": 540,
            "endMinute": 1020,
            "isActive": true
          },
          {
            "dayOfWeek": 2,
            "startMinute": 540,
            "endMinute": 1020,
            "isActive": true
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: json
    content: |-
      {
        "staffId": "33333333-3333-4333-8333-333333333333",
        "rows": [
          {
            "dayOfWeek": 1,
            "startMinute": 540,
            "endMinute": 1020,
            "isActive": true
          },
          {
            "dayOfWeek": 2,
            "startMinute": 540,
            "endMinute": 1020,
            "isActive": true
          }
        ]
      }
order: 1000
