$kind: http-example
request:
  url: "{{baseUrl}}/merchants/:merchantId/customers"
  method: GET
  pathVariables:
    merchantId: 11111111-1111-4111-8111-111111111111
  headers:
    - key: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  body:
    type: json
    content: |-
      [
        {
          "customerId": "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee",
          "fullName": "Jane Customer",
          "email": "jane@example.com",
          "phoneNumber": "+15559876543",
          "firstSeenAt": "2026-05-01T10:00:00.000Z",
          "lastSeenAt": "2026-05-02T15:30:00.000Z",
          "status": "active"
        }
      ]
order: 1000
