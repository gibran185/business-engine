$kind: http-example
request:
  url: "{{baseUrl}}/merchants/:merchantId/services/:serviceId"
  method: PATCH
  pathVariables:
    merchantId: 11111111-1111-4111-8111-111111111111
    serviceId: 22222222-2222-4222-8222-222222222222
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    content: |-
      {
        "name": "Haircut Deluxe",
        "price": 42,
        "durationMinutes": 60,
        "isActive": false
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: json
    content: |-
      {
        "id": "22222222-2222-4222-8222-222222222222",
        "merchant_id": "11111111-1111-4111-8111-111111111111",
        "name": "Haircut Deluxe",
        "description": "Standard cut and style",
        "price": "42.00",
        "duration_minutes": 60,
        "is_active": false,
        "created_at": "2026-05-01T12:00:00.000Z"
      }
order: 1000
