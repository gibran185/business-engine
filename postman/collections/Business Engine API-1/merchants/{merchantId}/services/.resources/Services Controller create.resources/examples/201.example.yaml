$kind: http-example
request:
  url: "{{baseUrl}}/merchants/:merchantId/services"
  method: POST
  pathVariables:
    merchantId: 11111111-1111-4111-8111-111111111111
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer {{bearerToken}}
  body:
    type: json
    content: |-
      {
        "name": "Haircut",
        "description": "Standard cut and style",
        "price": 35.5,
        "durationMinutes": 45,
        "isActive": true
      }
response:
  statusCode: 201
  statusText: Created
  body:
    type: json
    content: |-
      {
        "id": "22222222-2222-4222-8222-222222222222",
        "merchant_id": "11111111-1111-4111-8111-111111111111",
        "name": "Haircut",
        "description": "Standard cut and style",
        "price": "35.50",
        "duration_minutes": 45,
        "is_active": true,
        "created_at": "2026-05-01T12:00:00.000Z"
      }
order: 1000
