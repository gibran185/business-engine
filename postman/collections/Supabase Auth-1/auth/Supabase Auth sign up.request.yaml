$kind: http-request
url: "{{supabaseUrl}}/auth/v1/signup"
method: POST
headers:
  Content-Type: application/json
  apikey: "{{supabaseAnonKey}}"
  Authorization: "Bearer {{supabaseAnonKey}}"
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "password": "{{testPassword}}"
    }
examples: ./.resources/Supabase Auth sign up.resources/examples
order: 3000
