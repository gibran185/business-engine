$kind: http-example
request:
  url: "{{supabaseUrl}}/auth/v1/token?grant_type=password"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: apikey
      value: "{{supabaseAnonKey}}"
    - key: Authorization
      value: "Bearer {{supabaseAnonKey}}"
  body:
    type: json
    content: |-
      {
        "email": "{{testEmail}}",
        "password": "{{testPassword}}"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: json
    content: |-
      {
        "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
        "token_type": "bearer",
        "expires_in": 3600,
        "expires_at": 1234567890,
        "refresh_token": "v1:...",
        "user": {
          "id": "uuid",
          "email": "customer@example.com"
        }
      }
order: 1000
