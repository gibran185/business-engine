$kind: http-request
name: Supabase Auth customer test sign in password
url: "{{supabaseUrl}}/auth/v1/token?grant_type=password"
method: POST
headers:
  Content-Type: application/json
  apikey: "{{supabaseAnonKey}}"
  Authorization: Bearer {{supabaseAnonKey}}
body:
  type: json
  content: |-
    {
      "email": "{{customerTestEmail}}",
      "password": "{{customerTestPassword}}"
    }
scripts:
  - type: afterResponse
    code: |
      const jsonData = pm.response.json();

      pm.environment.set("bearerToken", jsonData.access_token);
    language: text/javascript
examples: .resources/Supabase Auth customer test sign in password.resources/examples
order: 1525
